<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" class="body-graphic ritual-graphic" aria-hidden="true" id="paused"><style><![CDATA[.mist-art{animation:drift 16s ease-in-out infinite alternate}
.blood-moon{animation:breathe 6s ease-in-out infinite}
.lotus-orbit{animation:orbit 90s linear infinite}
.floating-name{animation:rise 8s ease-in-out infinite}
.fracture{animation:breathe 4s ease-in-out infinite}
.slow-turn{transform-origin:300px 300px;animation:orbit 130s linear infinite}
.flow-line{stroke-dasharray:8 5;animation:lineflow 8s linear infinite}
.slow-turn,.flow-line{animation:none}
.flow-line{stroke:#e84b6f!important}
.fracture{stroke:#d32c4b!important}
.slow-turn{animation-duration:100s}
.lotus-orbit{animation-duration:75s}
@keyframes drift{to{transform:translateX(50px) translateY(-8px);opacity:.5}}
@keyframes breathe{50%{opacity:.6}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes rise{50%{transform:translateY(-22px);opacity:.3}}
@keyframes embers{0%{transform:translateY(80px);opacity:0}20%{opacity:.7}100%{transform:translateY(-300px);opacity:0}}
@keyframes lineflow{to{stroke-dashoffset:-104}}
@keyframes introturn{to{transform:rotate(360deg)}}
@keyframes sealbreathe{50%{opacity:.55}}
@keyframes unsealflash{0%{opacity:0}28%{opacity:.7}100%{opacity:0}}
@keyframes folio-sheen{0%,65%{left:-110px}90%,100%{left:110%}}
@keyframes sigil-wave{0%{opacity:.9;transform:translate(-50%,-50%) scale(.25) rotate(0)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.1) rotate(35deg)}}
@keyframes gd-record-open{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}
:root:target *{animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){*{animation:none!important}}]]></style><defs><radialGradient id="body-ritual-7"><stop stop-color="#a43754" stop-opacity=".32"/><stop offset="1" stop-color="#a43754" stop-opacity="0"/></radialGradient><linearGradient id="body-ritual-silver-7" x2="1" y2="1"><stop stop-color="#eeebf2"/><stop offset="1" stop-color="#777389"/></linearGradient></defs><circle cx="300" cy="300" r="295" fill="url(#body-ritual-7)"/><g class="slow-turn"><circle cx="300" cy="300" r="126" stroke="#bb7a8e" stroke-opacity=".5" stroke-dasharray="0"/><circle cx="300" cy="300" r="170" stroke="#bb7a8e" stroke-opacity=".5" stroke-dasharray="0"/><circle cx="300" cy="300" r="232" stroke="#bb7a8e" stroke-opacity=".5" stroke-dasharray="2 9"/><circle cx="300" cy="300" r="254" stroke="#bb7a8e" stroke-opacity=".5" stroke-dasharray="0"/><circle cx="554.00" cy="300.00" r="5" fill="#d87795" opacity="0.9"/><path d="M554.00 300.00L430.02 409.52" stroke="#b05976" stroke-opacity=".45"/><circle cx="553.50" cy="315.95" r="3" fill="#d87795" opacity="0.4"/><circle cx="552.00" cy="331.83" r="3" fill="#d87795" opacity="0.4"/><circle cx="549.50" cy="347.59" r="3" fill="#d87795" opacity="0.4"/><circle cx="546.02" cy="363.17" r="3" fill="#d87795" opacity="0.4"/><circle cx="541.57" cy="378.49" r="3" fill="#d87795" opacity="0.4"/><circle cx="536.16" cy="393.50" r="3" fill="#d87795" opacity="0.4"/><circle cx="529.83" cy="408.15" r="3" fill="#d87795" opacity="0.4"/><circle cx="522.58" cy="422.37" r="3" fill="#d87795" opacity="0.4"/><circle cx="514.46" cy="436.10" r="3" fill="#d87795" opacity="0.4"/><circle cx="505.49" cy="449.30" r="5" fill="#d87795" opacity="0.9"/><path d="M505.49 449.30L340.82 465.03" stroke="#b05976" stroke-opacity=".45"/><circle cx="495.71" cy="461.91" r="3" fill="#d87795" opacity="0.4"/><circle cx="485.16" cy="473.87" r="3" fill="#d87795" opacity="0.4"/><circle cx="473.87" cy="485.16" r="3" fill="#d87795" opacity="0.4