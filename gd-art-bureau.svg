<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" fill="none" role="img" aria-label="은빛 산줄기 아래 자리한 백악청사 형상의 풍경" id="paused"><style><![CDATA[.mist-art{animation:drift 16s ease-in-out infinite alternate}
.blood-moon{animation:breathe 6s ease-in-out infinite}
.lotus-orbit{animation:orbit 90s linear infinite}
.floating-name{animation:rise 8s ease-in-out infinite}
.fracture{animation:breathe 4s ease-in-out infinite}
.fracture{stroke:#d32c4b!important}
.lotus-orbit{animation-duration:75s}
@keyframes drift{to{transform:translateX(50px) translateY(-8px);opacity:.5}}
@keyframes breathe{50%{opacity:.6}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes rise{50%{transform:translateY(-22px);opacity:.3}}
@keyframes embers{0%{transform:translateY(80px);opacity:0}20%{opacity:.7}100%{transform:translateY(-300px);opacity:0}}
@keyframes lineflow{to{stroke-dashoffset:-104}}
@keyframes introturn{to{transform:rotate(360deg)}}
@keyframes sealbreathe{50%{opacity:.55}}
@keyframes unsealflash{0%{opacity:0}28%{opacity:.7}100%{opacity:0}}
@keyframes folio-sheen{0%,65%{left:-110px}90%,100%{left:110%}}
@keyframes sigil-wave{0%{opacity:.9;transform:translate(-50%,-50%) scale(.25) rotate(0)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.1) rotate(35deg)}}
@keyframes gd-record-open{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}
:root:target *{animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){*{animation:none!important}}]]></style><defs><linearGradient id="sky-mountain-8" x2="0" y2="1"><stop stop-color="#08090e"/><stop offset="1" stop-color="#20202b"/></linearGradient><radialGradient id="moon-mountain-8"><stop stop-color="#e45567"/><stop offset=".78" stop-color="#ae233e"/><stop offset="1" stop-color="#591527"/></radialGradient><linearGradient id="silver-mountain-8" x2="1" y2="1"><stop stop-color="#e6e4ea"/><stop offset=".42" stop-color="#a4a3b1"/><stop offset="1" stop-color="#44444f"/></linearGradient><radialGradient id="glow-mountain-8"><stop stop-color="#a92845" stop-opacity=".45"/><stop offset="1" stop-color="#a92845" stop-opacity="0"/></radialGradient><filter id="grain-mountain-8"><feTurbulence type="fractalNoise" baseFrequency=".6" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".12"/></feComponentTransfer><feBlend in="SourceGraphic" mode="soft-light"/></filter></defs><rect width="1200" height="760" fill="url(#sky-mountain-8)"/><circle class="moon-halo" cx="820" cy="235" r="270" fill="url(#glow-mountain-8)"/><circle class="blood-moon" cx="820" cy="235" r="119" fill="url(#moon-mountain-8)"/><circle cx="820" cy="235" r="132" stroke="#b16f7d" stroke-opacity=".25"/><path d="M-40 475L35 405 89 428 178 293 231 345 295 380 376 256 433 345 520 309 611 426 694 376 765 418 872 340 990 402 1081 299 1250 444V800H-40Z" fill="#20212b" stroke="#9495a3" stroke-opacity="0.3"/><path d="M-40 527L35 457 89 480 178 345 231 397 295 432 376 308 433 397 520 361 611 478 694 428 765 470 872 392 990 454 1081 351 1250 496V800H-40Z" fill="#171923" stroke="#9495a3" stroke-opacity="0.22999999999999998"/><path d="M-40 579L35 509 89 532 178 397 231 449 295 484 376 360 433 449 520 413 611 530 694 480 765 522 872 444 990 506 1081 403 1250 548V800H-40Z" fill="#101219" stroke="#9495a3" stroke-opacity="0.15999999999