<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" fill="none" role="img" aria-label="붉은 빛을 품은 흑련과 동심원 문양" id="paused"><style><![CDATA[.mist-art{animation:drift 16s ease-in-out infinite alternate}
.blood-moon{animation:breathe 6s ease-in-out infinite}
.lotus-orbit{animation:orbit 90s linear infinite}
.floating-name{animation:rise 8s ease-in-out infinite}
.fracture{animation:breathe 4s ease-in-out infinite}
.fracture{stroke:#d32c4b!important}
.lotus-orbit{animation-duration:75s}
@keyframes drift{to{transform:translateX(50px) translateY(-8px);opacity:.5}}
@keyframes breathe{50%{opacity:.6}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes rise{50%{transform:translateY(-22px);opacity:.3}}
@keyframes embers{0%{transform:translateY(80px);opacity:0}20%{opacity:.7}100%{transform:translateY(-300px);opacity:0}}
@keyframes lineflow{to{stroke-dashoffset:-104}}
@keyframes introturn{to{transform:rotate(360deg)}}
@keyframes sealbreathe{50%{opacity:.55}}
@keyframes unsealflash{0%{opacity:0}28%{opacity:.7}100%{opacity:0}}
@keyframes folio-sheen{0%,65%{left:-110px}90%,100%{left:110%}}
@keyframes sigil-wave{0%{opacity:.9;transform:translate(-50%,-50%) scale(.25) rotate(0)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.1) rotate(35deg)}}
@keyframes gd-record-open{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}
:root:target *{animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){*{animation:none!important}}]]></style><defs><linearGradient id="sky-lotus-13" x2="0" y2="1"><stop stop-color="#08090e"/><stop offset="1" stop-color="#20202b"/></linearGradient><radialGradient id="moon-lotus-13"><stop stop-color="#e45567"/><stop offset=".78" stop-color="#ae233e"/><stop offset="1" stop-color="#591527"/></radialGradient><linearGradient id="silver-lotus-13" x2="1" y2="1"><stop stop-color="#e6e4ea"/><stop offset=".42" stop-color="#a4a3b1"/><stop offset="1" stop-color="#44444f"/></linearGradient><radialGradient id="glow-lotus-13"><stop stop-color="#a92845" stop-opacity=".45"/><stop offset="1" stop-color="#a92845" stop-opacity="0"/></radialGradient><filter id="grain-lotus-13"><feTurbulence type="fractalNoise" baseFrequency=".6" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".12"/></feComponentTransfer><feBlend in="SourceGraphic" mode="soft-light"/></filter></defs><rect width="1200" height="760" fill="url(#sky-lotus-13)"/><ellipse cx="600" cy="415" rx="390" ry="290" fill="url(#glow-lotus-13)"/><circle cx="600" cy="367" r="110" stroke="#b7919f" stroke-opacity=".25"/><circle cx="600" cy="367" r="166" stroke="#b7919f" stroke-opacity=".25"/><circle cx="600" cy="367" r="233" stroke="#b7919f" stroke-opacity=".25"/><circle cx="600" cy="367" r="294" stroke="#b7919f" stroke-opacity=".25"/><g class="lotus-orbit" transform-origin="600 367"><path d="M894.00 367.00L908.00 367.00" stroke="#a57383" stroke-opacity=".7"/><path d="M892.88 392.62L898.86 393.15" stroke="#a57383" stroke-opacity=".7"/><path d="M889.53 418.05L895.44 419.09" stroke="#a57383" stroke-opacity=".7"/><path d="M883.98 443.09L889.78 444.65" stroke="#a57383" stroke-opacity=".7"/><path d="M876.27 467.55L881.91 469.61" stroke="#a57383" stroke-opacity=".7"/><path d="M866.45 491.25L871.89 493.79" stroke="#a57383" stroke-opacity=".7"/><p