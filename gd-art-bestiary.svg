<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" fill="none" role="img" aria-label="펼쳐진 은빛 도감에서 번지는 붉은 이름의 빛" id="paused"><style><![CDATA[.mist-art{animation:drift 16s ease-in-out infinite alternate}
.blood-moon{animation:breathe 6s ease-in-out infinite}
.lotus-orbit{animation:orbit 90s linear infinite}
.floating-name{animation:rise 8s ease-in-out infinite}
.fracture{animation:breathe 4s ease-in-out infinite}
.fracture{stroke:#d32c4b!important}
.lotus-orbit{animation-duration:75s}
@keyframes drift{to{transform:translateX(50px) translateY(-8px);opacity:.5}}
@keyframes breathe{50%{opacity:.6}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes rise{50%{transform:translateY(-22px);opacity:.3}}
@keyframes embers{0%{transform:translateY(80px);opacity:0}20%{opacity:.7}100%{transform:translateY(-300px);opacity:0}}
@keyframes lineflow{to{stroke-dashoffset:-104}}
@keyframes introturn{to{transform:rotate(360deg)}}
@keyframes sealbreathe{50%{opacity:.55}}
@keyframes unsealflash{0%{opacity:0}28%{opacity:.7}100%{opacity:0}}
@keyframes folio-sheen{0%,65%{left:-110px}90%,100%{left:110%}}
@keyframes sigil-wave{0%{opacity:.9;transform:translate(-50%,-50%) scale(.25) rotate(0)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.1) rotate(35deg)}}
@keyframes gd-record-open{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}
:root:target *{animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){*{animation:none!important}}]]></style><defs><linearGradient id="sky-book-19" x2="0" y2="1"><stop stop-color="#08090e"/><stop offset="1" stop-color="#20202b"/></linearGradient><radialGradient id="moon-book-19"><stop stop-color="#e45567"/><stop offset=".78" stop-color="#ae233e"/><stop offset="1" stop-color="#591527"/></radialGradient><linearGradient id="silver-book-19" x2="1" y2="1"><stop stop-color="#e6e4ea"/><stop offset=".42" stop-color="#a4a3b1"/><stop offset="1" stop-color="#44444f"/></linearGradient><radialGradient id="glow-book-19"><stop stop-color="#a92845" stop-opacity=".45"/><stop offset="1" stop-color="#a92845" stop-opacity="0"/></radialGradient><filter id="grain-book-19"><feTurbulence type="fractalNoise" baseFrequency=".6" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".12"/></feComponentTransfer><feBlend in="SourceGraphic" mode="soft-light"/></filter></defs><rect width="1200" height="760" fill="url(#sky-book-19)"/><ellipse cx="600" cy="360" rx="385" ry="310" fill="url(#glow-book-19)"/><g stroke="url(#silver-book-19)" stroke-width="1.5"><path d="M600 577Q401 528 215 588L250 314Q415 266 600 356Q785 266 950 314L985 588Q799 528 600 577Z" fill="#12121a"/><path d="M600 577V356M216 599Q402 541 600 589Q798 541 984 599M210 609Q400 552 600 599Q800 552 990 609"/><path d="M265 326Q427 293 588 367L575 552Q414 514 240 563ZM935 326Q773 293 612 367L625 552Q786 514 960 563Z" fill="#24232d"/></g><path d="M283 367Q427 344 555 391M917 367Q773 344 645 391" stroke="#b9b2c1" stroke-opacity=".22"/><path d="M281 381Q427 358 555 405M919 381Q773 358 645 405" stroke="#b9b2c1" stroke-opacity=".22"/><path d="M279 395Q427 372 555 419M921 395Q773 372 645 419" stroke="#b9b2c1" stroke-opacity=".22"/><path d="M277 409Q427 386 555 433M923 409Q773 386 645 433" stroke="#b9b2c1" stroke-opacity=".22"/><path d="M275 423Q42