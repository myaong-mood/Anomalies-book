<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" class="body-graphic well-graphic" aria-hidden="true" id="paused"><style><![CDATA[.mist-art{animation:drift 16s ease-in-out infinite alternate}
.blood-moon{animation:breathe 6s ease-in-out infinite}
.lotus-orbit{animation:orbit 90s linear infinite}
.floating-name{animation:rise 8s ease-in-out infinite}
.fracture{animation:breathe 4s ease-in-out infinite}
.slow-turn{transform-origin:300px 300px;animation:orbit 130s linear infinite}
.flow-line{stroke-dasharray:8 5;animation:lineflow 8s linear infinite}
.slow-turn,.flow-line{animation:none}
.flow-line{stroke:#e84b6f!important}
.fracture{stroke:#d32c4b!important}
.slow-turn{animation-duration:100s}
.lotus-orbit{animation-duration:75s}
@keyframes drift{to{transform:translateX(50px) translateY(-8px);opacity:.5}}
@keyframes breathe{50%{opacity:.6}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes rise{50%{transform:translateY(-22px);opacity:.3}}
@keyframes embers{0%{transform:translateY(80px);opacity:0}20%{opacity:.7}100%{transform:translateY(-300px);opacity:0}}
@keyframes lineflow{to{stroke-dashoffset:-104}}
@keyframes introturn{to{transform:rotate(360deg)}}
@keyframes sealbreathe{50%{opacity:.55}}
@keyframes unsealflash{0%{opacity:0}28%{opacity:.7}100%{opacity:0}}
@keyframes folio-sheen{0%,65%{left:-110px}90%,100%{left:110%}}
@keyframes sigil-wave{0%{opacity:.9;transform:translate(-50%,-50%) scale(.25) rotate(0)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.1) rotate(35deg)}}
@keyframes gd-record-open{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}
:root:target *{animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){*{animation:none!important}}]]></style><defs><radialGradient id="body-well-11"><stop stop-color="#a43754" stop-opacity=".32"/><stop offset="1" stop-color="#a43754" stop-opacity="0"/></radialGradient><linearGradient id="body-well-silver-11" x2="1" y2="1"><stop stop-color="#eeebf2"/><stop offset="1" stop-color="#777389"/></linearGradient></defs><circle cx="300" cy="300" r="295" fill="url(#body-well-11)"/><path class="flow-line" d="M300 22V572" stroke="#cf768f" stroke-width="2"/><ellipse cx="300" cy="100" rx="210" ry="63.0" stroke="#c1b3cc" stroke-opacity=".65"/><path d="M90 100v50Q300 276.0 510 150v-50" stroke="#77667e" stroke-opacity=".6"/><ellipse cx="300" cy="225" rx="155" ry="46.5" stroke="#c1b3cc" stroke-opacity=".65"/><path d="M145 225v50Q300 368.0 455 275v-50" stroke="#77667e" stroke-opacity=".6"/><ellipse cx="300" cy="360" rx="115" ry="34.5" stroke="#c1b3cc" stroke-opacity=".65"/><path d="M185 360v50Q300 479.0 415 410v-50" stroke="#77667e" stroke-opacity=".6"/><ellipse cx="300" cy="495" rx="85" ry="25.5" stroke="#c1b3cc" stroke-opacity=".65"/><path d="M215 495v50Q300 596.0 385 545v-50" stroke="#77667e" stroke-opacity=".6"/><text x="300" y="108" text-anchor="middle" fill="#e0d5e5" font-family="sans-serif" font-size="27">正脈</text><text x="300" y="370" text-anchor="middle" fill="#e0d5e5" font-family="sans-serif" font-size="27">中穴</text><text x="300" y="505" text-anchor="middle" fill="#e093ac" font-family="sans-serif" font-size="27">圖鑑庫</text></svg>